<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Teacher Results</title>
<style>
:root{--ink:#1f2433;--muted:#5b6070;--paper:#fbf6ea;--line:#e3d9c2;--navy:#22305a;--green:#23855c;--gold:#d79b22;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);font-size:15px}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin-bottom:4px} h2{font-size:19px;margin:18px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
input,select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #c9c2ae;background:#fff}
button{background:var(--navy);color:#fff;border-color:var(--navy);cursor:pointer;font-weight:600}
button.ghost{background:#fff;color:var(--navy)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#fbecc8;position:sticky;top:0;cursor:pointer;white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.g{background:#ddf3e8;color:#16603f}.y{background:#fbecc8;color:#7a5200}.r{background:#fbe3df;color:#8d2418}.n{color:#999}
.avg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.avg div{background:#f3efe3;border-radius:10px;padding:10px}
.avg b{display:block;font-size:24px}
details summary{cursor:pointer;color:var(--navy);font-weight:600}
pre{white-space:pre-wrap;font-family:inherit;font-size:13px;max-width:520px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 Library of Lost Voices: Teacher Results</h1>
  <p class="muted">Each student gets one row that updates as they move through the rooms. Skills under 70% are red; 70–84% yellow; 85%+ green.</p>

  <div class="card">
    <div class="row">
      <label for="pin"><b>Teacher PIN</b></label>
      <input type="password" id="pin" placeholder="PIN from Code.gs">
      <button id="load">Load results</button>
      <button class="ghost" id="local">Show results saved on this device</button>
      <span id="msg" class="muted"></span>
    </div>
  </div>

  <div id="out" hidden>
    <div class="card">
      <div class="row">
        <label for="cls"><b>Class</b></label><select id="cls"></select>
        <label><input type="checkbox" id="onlyDone"> Escaped only</label>
        <input type="text" id="q" placeholder="Search name…">
        <button class="ghost" id="csv">Download CSV</button>
        <button class="ghost" id="refresh">Refresh</button>
      </div>
      <h2>Class averages</h2>
      <div class="avg" id="avg"></div>
    </div>
    <div class="card scroll"><table id="tbl"></table></div>
  </div>
</div>
<script src="config.js"></script>
<script>
const CFG = window.ESCAPE_CONFIG||{};
const SK = [["interjections","Interjections"],["sort","Direct vs. Indirect"],["punctuate","Punctuating"],["convert","Converting"],["proofread","Proofreading"]];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pctOf = v => { const m=String(v||"").match(/\((\d+)%\)/); return m?+m[1]:null; };
const cls = p => p==null?"n":p>=85?"g":p>=70?"y":"r";
let rows=[], sortKey="name", sortDir=1;
const $ = id=>document.getElementById(id);

try{ $("pin").value = sessionStorage.getItem("lolv-pin")||""; }catch(e){}

async function loadRemote(){
  if(!CFG.RESULTS_URL){ $("msg").textContent="No RESULTS_URL is set in config.js yet. See TEACHER-SETUP.md."; return; }
  const pin=$("pin").value.trim(); if(!pin){ $("msg").textContent="Enter your PIN."; return; }
  $("msg").textContent="Loading…";
  try{
    const r = await fetch(CFG.RESULTS_URL+"?pin="+encodeURIComponent(pin));
    const d = await r.json();
    if(!d.ok){ $("msg").textContent = d.error||"Could not load."; return; }
    try{ sessionStorage.setItem("lolv-pin",pin); }catch(e){}
    rows = d.rows; $("msg").textContent = rows.length+" games loaded "+new Date().toLocaleTimeString(); show();
  }catch(e){ $("msg").textContent="Could not reach the Google Sheet. Check the URL in config.js and that the web app is deployed for 'Anyone'."; }
}
function loadLocal(){
  try{ rows = JSON.parse(localStorage.getItem("lolv-history")||"[]"); }catch(e){ rows=[]; }
  $("msg").textContent = rows.length+" games found on this device"; show();
}
function filtered(){
  const c=$("cls").value, q=$("q").value.toLowerCase(), done=$("onlyDone").checked;
  return rows.filter(r=>(!c||r.className===c)&&(!q||String(r.name).toLowerCase().includes(q))&&(!done||r.status==="ESCAPED"));
}
function show(){
  $("out").hidden=false;
  const classes=[...new Set(rows.map(r=>r.className).filter(Boolean))].sort();
  const cur=$("cls").value;
  $("cls").innerHTML=`<option value="">All classes</option>`+classes.map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("");
  const list = filtered().sort((a,b)=>{ let x=a[sortKey], y=b[sortKey];
    if(SK.some(s=>s[0]===sortKey)){ x=pctOf(x)??-1; y=pctOf(y)??-1; }
    else if(["accuracy","minutes","wrong","correct","roomsDone"].includes(sortKey)){ x=+x||0; y=+y||0; }
    else { x=String(x).toLowerCase(); y=String(y).toLowerCase(); }
    return x<y?-sortDir:x>y?sortDir:0; });
  const avg = k => { const v=list.map(r=>k==="accuracy"?+r.accuracy:pctOf(r[k])).filter(v=>v!=null&&!isNaN(v)); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null; };
  const escaped = list.filter(r=>r.status==="ESCAPED").length;
  $("avg").innerHTML = `<div><b>${list.length}</b>students · ${escaped} escaped</div><div><b class="pill ${cls(avg("accuracy"))}">${avg("accuracy")??"—"}%</b>overall accuracy</div>`+
    SK.map(([k,l])=>{ const a=avg(k); return `<div><b class="pill ${cls(a)}">${a??"—"}${a!=null?"%":""}</b>${l}</div>`; }).join("");
  const cols=[["name","Student"],["className","Class"],["status","Status"],["minutes","Min"],["accuracy","Accuracy"],...SK,["missed","Missed questions"]];
  $("tbl").innerHTML = `<tr>${cols.map(([k,l])=>`<th data-k="${k}">${l}${sortKey===k?(sortDir>0?" ▲":" ▼"):""}</th>`).join("")}</tr>`+
    list.map(r=>`<tr>
      <td><b>${esc(r.name)}</b><div class="muted">${esc(r.startedAt)}</div></td>
      <td>${esc(r.className)}</td>
      <td>${r.status==="ESCAPED"?'<span class="pill g">🏆 Escaped</span>':esc(r.status)}</td>
      <td>${esc(r.minutes)}</td>
      <td><span class="pill ${cls(+r.accuracy)}">${esc(r.accuracy)}%</span><div class="muted">${esc(r.correct)} ✓ / ${esc(r.wrong)} ✗</div></td>
      ${SK.map(([k])=>`<td><span class="pill ${cls(pctOf(r[k]))}">${esc(r[k]||"—")}</span></td>`).join("")}
      <td>${r.missed?`<details><summary>${String(r.missed).split("\n").length} missed</summary><pre>${esc(r.missed)}</pre></details>`:'<span class="muted">none</span>'}</td>
    </tr>`).join("");
  document.querySelectorAll("th").forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=1; } show(); });
}
function csv(){
  const keys=["name","className","status","roomsDone","startedAt","updatedAt","minutes","correct","wrong","accuracy",...SK.map(s=>s[0]),"missed"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const txt=[keys.join(","),...filtered().map(r=>keys.map(k=>q(r[k])).join(","))].join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"})); a.download="escape-room-results.csv"; a.click();
}
$("load").onclick=loadRemote; $("refresh").onclick=()=>$("pin").value?loadRemote():loadLocal(); $("local").onclick=loadLocal;
$("pin").onkeydown=e=>{ if(e.key==="Enter") loadRemote(); };
["cls","q","onlyDone"].forEach(id=>$(id).oninput=show); $("csv").onclick=csv;
</script>
</body>
</html>
